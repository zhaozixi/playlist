name: scrape-and-deploy

# 抓取窗口是北京时间 08:00 与 16:00，但 Actions 的 schedule 只是「尽力而为」：
# 实测会被推迟数小时甚至整槽跳过（2026-09-29 的 16:00 槽位实际 22:42 才跑，
# 次日 08:00 那一槽完全没出现）。所以这里每 2 小时醒一次，
# 由 crawler/gate.py 判断「最近一个排程槽是否已经有数据」：
#   00/08 整点（=CST 08:00/16:00）→ 正常抓取
#   其余时段 → 只有本轮漏跑才补，已新鲜就几秒内退出
# 公开仓库的 Linux runner 分钟数不计费，多几个空跑的槽位没有成本。
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      cities:
        description: "要抓取的城市（逗号分隔，留空用默认江浙沪清单）"
        required: false
        default: ""
      force:
        description: "忽略新鲜度闸门，强制抓一轮"
        type: boolean
        default: false
  push:
    branches: [main]
    # 只监听代码变更。web/index.html、web/data.json 由机器人提交，
    # 若列入这里会再次触发自举形成循环（[skip ci] 是第二道保险）。
    paths:
      - "crawler/**"
      - "web/build.py"
      - ".github/workflows/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            web/data.json
            crawler/gate.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: gate
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
        run: |
          # 手动触发与代码推送一律抓；定时任务问闸门。
          # 闸门本身出问题（脚本缺失/报错）时按「该抓」处理，宁可多跑一轮也不能漏。
          if [ "$EVENT" != "schedule" ] || [ "$FORCE" = "true" ]; then
            echo "外部触发（$EVENT）或 force=$FORCE，直接抓"
            echo "run=yes" >> "$GITHUB_OUTPUT"
          elif [ ! -f crawler/gate.py ]; then
            echo "缺少 crawler/gate.py，保守起见照常抓"
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            ans=$(python crawler/gate.py --explain || echo yes)
            echo "run=$ans" >> "$GITHUB_OUTPUT"
          fi

  scrape:
    needs: decide
    if: needs.decide.outputs.run == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet requests

      # 抓取失败不中断后续步骤：仓库里已有上一次提交的 data.json，
      # 照常部署，站点会保留旧数据而不是 500/白屏。
      - name: 抓取演出信息
        continue-on-error: true
        env:
          TW_REQUEST_INTERVAL: "1"
          TW_CITIES: "${{ inputs.cities }}"
        run: |
          if [ -n "$TW_CITIES" ]; then
            python crawler/scrape.py --cities "$TW_CITIES"
          else
            python crawler/scrape.py
          fi

      - name: 构建页面与日历
        run: python web/build.py

      - name: 提交数据快照
        run: |
          git config user.name  "theatre-watch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/shows.json data/changelog.json web/data.json web/index.html web/calendar.ics
          if git diff --cached --quiet; then
            echo "本轮无变化，跳过提交"
          else
            n=$(python -c "import json;print(json.load(open('web/data.json'))['counts']['total'])")
            git commit -q -m "chore: 自动更新演出数据（${n} 场） [skip ci]"
            git push
          fi

  deploy:
    needs: [decide, scrape]
    if: needs.scrape.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.out.outputs.page_url }}
    steps:
      # 必须显式取 main：scrape 作业会把新快照提交到 main，
      # 默认 checkout 拿的是触发本次运行的旧提交，页面会滞后一轮。
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: out
        uses: actions/deploy-pages@v4
