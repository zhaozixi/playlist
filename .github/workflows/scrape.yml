name: scrape-and-deploy

# 每天 08:00 与 16:00（北京时间 = UTC+8）各跑一次。
# Actions 用 UTC：UTC 00:00 = CST 08:00，UTC 08:00 = CST 16:00。
on:
  schedule:
    - cron: "0 0,8 * * *"
  workflow_dispatch:
    inputs:
      enrich:
        description: "访问详情页补全场馆/档期（较慢，请求数翻倍）"
        type: boolean
        default: true
  push:
    branches: [main]
    # 只监听代码变更。web/index.html、web/data.json 由机器人提交，
    # 若列入这里会再次触发自举形成循环（[skip ci] 是第二道保险）。
    paths:
      - "crawler/**"
      - "web/build.py"
      - ".github/workflows/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet requests beautifulsoup4 lxml

      # 抓取失败不中断后续步骤：仓库里已有上一次提交的 data.json，
      # 照常部署，站点会保留旧数据而不是 500/白屏。
      - name: 抓取演出信息
        continue-on-error: true
        env:
          TW_REQUEST_INTERVAL: "2"
          TW_MAX_ENRICH: "60"
        run: |
          if [ "${{ inputs.enrich }}" = "false" ]; then
            python crawler/scrape.py
          else
            python crawler/scrape.py --enrich
          fi

      - name: 构建页面与日历
        run: python web/build.py

      - name: 提交数据快照
        run: |
          git config user.name  "theatre-watch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/shows.json data/changelog.json web/data.json web/index.html web/calendar.ics
          if git diff --cached --quiet; then
            echo "本轮无变化，跳过提交"
          else
            n=$(python -c "import json;print(json.load(open('web/data.json'))['counts']['total'])")
            git commit -q -m "chore: 自动更新演出数据（${n} 场） [skip ci]"
            git push
          fi

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.out.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: out
        uses: actions/deploy-pages@v4
