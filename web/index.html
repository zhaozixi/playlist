<script>
(function(){
  var DATA = null;
  var el = document.getElementById('snapshot');
  try { DATA = JSON.parse(el.textContent); } catch(e) { DATA = {shows:[]}; }

  var state = {kind:'', when:'', city:'', q:''};
  var $ = function(id){ return document.getElementById(id); };
  var list = $('list');

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function applyFilters(){
    var rows = (DATA.shows || []).filter(function(s){
      if(state.kind && s.kind !== state.kind) return false;
      if(state.city && s.city !== state.city) return false;
      if(state.when){
        if(s.days === null || s.days === undefined) return false;
        if(!(s.days >= 0 && s.days <= Number(state.when))) return false;
      }
      if(state.q){
        var hay = (s.title + ' ' + s.venue).toLowerCase();
        if(hay.indexOf(state.q.toLowerCase()) === -1) return false;
      }
      return true;
    });
    return rows;
  }

  function whenLabel(s){
    if(s.days === null || s.days === undefined) return '';
    if(s.days < 0) return '已结束';
    if(s.days === 0) return '今天开演';
    if(s.days === 1) return '明天开演';
    if(s.days <= 7) return s.days + ' 天后';
    return '';
  }

  function render(){
    var rows = applyFilters();
    list.innerHTML = '';
    $('empty').hidden = rows.length > 0;
    rows.forEach(function(s){
      var a = document.createElement('a');
      a.className = 'item' + (s.is_new ? ' new' : '');
      a.href = s.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
      var w = whenLabel(s), wl = '';
      if(w){ wl = '<span class="pill' + (s.days <= 7 ? ' soon' : '') + '">' + esc(w) + '</span>'; }
      a.innerHTML =
        '<div class="row">' +
          (s.poster ? '<img class="poster" loading="lazy" decoding="async" referrerpolicy="no-referrer" ' +
            'src="' + esc(s.poster) + '" alt="">' : '') +
          '<div class="info">' +
          '<div class="top"><span class="tag ' + esc(s.kind) + '">' + esc(s.kind) + '</span>' +
            wl + (s.is_new ? '<span class="pill new">NEW</span>' : '') +
            (s.city ? '<span class="pill">' + esc(s.city) + '</span>' : '') +
            (s.status ? '<span class="pill">' + esc(s.status) + '</span>' : '') +
          '</div>' +
          '<div class="t">' + esc(s.title) + '</div>' +
          '<div class="meta"><span class="date">' + esc(s.date_text || s.date || '档期待定') + '</span>' +
            (s.shop || s.venue ? '<span>' + esc(s.shop || s.venue) + '</span>' : '') +
            (s.price ? '<span>¥' + esc(s.price) + '</span>' : '') +
          '</div>' +
          '</div>' +
        '</div>';
      list.appendChild(a);
    });
  }

  function cityStats(){
    var cnt = {};
    (DATA.shows || []).forEach(function(s){ if(s.city) cnt[s.city] = (cnt[s.city] || 0) + 1; });
    return Object.keys(cnt).sort(function(a, b){ return cnt[b] - cnt[a] || a.localeCompare(b, 'zh'); })
      .map(function(c){ return {name: c, n: cnt[c]}; });
  }

  function fillCities(){
    var sel = $('city'), cur = sel.value;
    sel.length = 1;
    cityStats().forEach(function(c){
      var o = document.createElement('option');
      o.value = c.name; o.textContent = c.name + '（' + c.n + '）'; sel.appendChild(o);
    });
    sel.value = cur;
  }

  function paint(){
    var c = DATA.counts || {};
    $('c-musical').textContent = c['音乐剧'] || 0;
    $('c-drama').textContent = c['话剧'] || 0;
    $('c-new').textContent = c.new || 0;
    $('updated').textContent = DATA.updated_at || '—';
    var cs = cityStats(), n = cs.length;
    $('scope').textContent = n
      ? (n > 4 ? n + ' 城（' + cs.slice(0, 3).map(function(c){ return c.name; }).join('、') + ' 等）'
               : cs.map(function(c){ return c.name; }).join('、'))
      : (DATA.city || '全国');
    $('src').textContent = DATA.source || '—';
    $('src-line').innerHTML = '数据来源：<a href="' + esc(DATA.source_url || '#') +
      '" target="_blank" rel="noopener noreferrer">' + esc(DATA.source || '—') + '</a>';
    var wb = $('warnbar');
    if(DATA.stale){
      wb.style.display = 'block';
      wb.textContent = '最近一次自动抓取未成功，当前展示的是上一次成功抓取的数据（' +
        (DATA.updated_at || '') + '）。';
    }
    document.title = '音乐剧·话剧 演出速览（' + (c.total || 0) + ' 场）';
  }

  document.querySelectorAll('.seg button').forEach(function(b){
    b.addEventListener('click', function(){
      var grp = b.parentElement;
      grp.querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-pressed','false'); });
      b.setAttribute('aria-pressed','true');
      if(b.dataset.kind !== undefined) state.kind = b.dataset.kind;
      if(b.dataset.when !== undefined) state.when = b.dataset.when;
      render();
    });
  });
  $('city').addEventListener('change', function(e){ state.city = e.target.value; render(); });
  $('q').addEventListener('input', function(e){ state.q = e.target.value.trim(); render(); });

  function hydrate(next){
    if(!next || !next.shows) return;
    DATA = next; fillCities(); paint(); render();
  }

  fillCities(); paint(); render();

  // 有独立 data.json 时优先取最新（GitHub Actions 每轮提交）
  fetch('data.json', {cache:'no-store'}).then(function(r){
    if(!r.ok) return;
    return r.json();
  }).then(hydrate).catch(function(){});

  // 每 10 分钟静默刷新一次
  setInterval(function(){
    fetch('data.json?ts=' + Date.now(), {cache:'no-store'})
      .then(function(r){ return r.ok ? r.json() : null; }).then(hydrate).catch(function(){});
  }, 600000);
})();
</script>
</body>
</html>
