<style>

  @media (prefers-color-scheme: light){
    :root{ --bg:#f6f7f9; --card:#fff; --line:#e3e6ea; --fg:#1a1d22; --dim:#6b7381; }
  }
  *{box-sizing:border-box}
  body{

    display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
  .seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
  .seg button{border:0;background:transparent;color:var(--dim);padding:6px 14px;border-radius:999px;
    font:inherit;font-size:13px;cursor:pointer}
  .seg button[aria-pressed=true]{background:var(--fg);color:var(--bg);font-weight:600}
  select,input[type=search]{
    background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:999px;
    padding:7px 12px;font:inherit;font-size:13px;outline:none;max-width:130px}
  input[type=search]{flex:1;min-width:120px;max-width:none}
  .list{display:flex;flex-direction:column;gap:10px;margin-top:14px}

    display:block;text-decoration:none;color:inherit;transition:border-color .15s}
  .item:hover{border-color:var(--dim)}
  .item.new{border-left:3px solid var(--new)}
  .row{display:flex;gap:12px}
  .poster{width:56px;height:78px;flex:0 0 56px;border-radius:6px;object-fit:cover;
    background:var(--line);display:block}
  .info{flex:1;min-width:0}
  .top{display:flex;gap:8px;align-items:center;margin-bottom:5px;flex-wrap:wrap}
  .tag{font-size:11px;padding:2px 8px;border-radius:6px;border:1px solid;font-weight:600}
  .tag.音乐剧{color:var(--musical);border-color:var(--musical);background:rgba(224,114,154,.1)}
  .tag.话剧{color:var(--drama);border-color:var(--drama);background:rgba(106,166,232,.1)}
  .pill{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:2px 7px}

  .pill.soon{color:var(--warn);border-color:var(--warn)}
  .t{font-size:15.5px;font-weight:600;line-height:1.45}
  .meta{color:var(--dim);font-size:12.5px;margin-top:5px;display:flex;flex-wrap:wrap;gap:4px 12px}
  .date{font-variant-numeric:tabular-nums}
  .empty{color:var(--dim);text-align:center;padding:50px 0;font-size:13.5px}
  footer{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);
    color:var(--dim);font-size:11.5px;line-height:1.8}
  footer a{color:var(--dim)}
</style>
</head>

<script>
(function(){
  var DATA = null;
  var el = document.getElementById('snapshot');
  try { DATA = JSON.parse(el.textContent); } catch(e) { DATA = {shows:[]}; }

  var state = {kind:'', when:'', city:'', q:''};
  var $ = function(id){ return document.getElementById(id); };
  var list = $('list');

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function applyFilters(){
    var rows = (DATA.shows || []).filter(function(s){
      if(state.kind && s.kind !== state.kind) return false;
      if(state.city && s.city !== state.city) return false;
      if(state.when){
        if(s.days === null || s.days === undefined) return false;
        if(!(s.days >= 0 && s.days <= Number(state.when))) return false;
      }
      if(state.q){
        var hay = (s.title + ' ' + s.venue).toLowerCase();
        if(hay.indexOf(state.q.toLowerCase()) === -1) return false;
      }
      return true;
    });
    return rows;
  }

  function whenLabel(s){
    if(s.days === null || s.days === undefined) return '';
    if(s.days < 0) return '已结束';
    if(s.days === 0) return '今天开演';
    if(s.days === 1) return '明天开演';
    if(s.days <= 7) return s.days + ' 天后';
    return '';
  }

  function render(){
    var rows = applyFilters();
    list.innerHTML = '';
    $('empty').hidden = rows.length > 0;
    rows.forEach(function(s){
      var a = document.createElement('a');
      a.className = 'item' + (s.is_new ? ' new' : '');
      a.href = s.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
      var w = whenLabel(s), wl = '';
      if(w){ wl = '<span class="pill' + (s.days <= 7 ? ' soon' : '') + '">' + esc(w) + '</span>'; }
      a.innerHTML =
        '<div class="row">' +
          (s.poster ? '<img class="poster" loading="lazy" decoding="async" referrerpolicy="no-referrer" ' +
            'src="' + esc(s.poster) + '" alt="">' : '') +
          '<div class="info">' +
          '<div class="top"><span class="tag ' + esc(s.kind) + '">' + esc(s.kind) + '</span>' +
            wl + (s.is_new ? '<span class="pill new">NEW</span>' : '') +
            (s.city ? '<span class="pill">' + esc(s.city) + '</span>' : '') +
            (s.status ? '<span class="pill">' + esc(s.status) + '</span>' : '') +
          '</div>' +
          '<div class="t">' + esc(s.title) + '</div>' +
          '<div class="meta"><span class="date">' + esc(s.date_text || s.date || '档期待定') + '</span>' +
            (s.shop || s.venue ? '<span>' + esc(s.shop || s.venue) + '</span>' : '') +
            (s.price ? '<span>¥' + esc(s.price) + '</span>' : '') +
          '</div>' +
          '</div>' +
        '</div>';
      list.appendChild(a);
    });
  }

  function fillCities(){
    var seen = {}, sel = $('city'), cur = sel.value;
    (DATA.shows || []).forEach(function(s){ if(s.city) seen[s.city] = 1; });
    Object.keys(seen).sort().forEach(function(c){
      var o = document.createElement('option'); o.value = c; o.textContent = c; sel.appendChild(o);
    });
    sel.value = cur;
  }

  function paint(){
    var c = DATA.counts || {};
    $('c-musical').textContent = c['音乐剧'] || 0;
    $('c-drama').textContent = c['话剧'] || 0;
    $('c-new').textContent = c.new || 0;
    $('updated').textContent = DATA.updated_at || '—';
    var cities = [];
    (DATA.shows || []).forEach(function(s){ if(s.city && cities.indexOf(s.city) === -1) cities.push(s.city); });
    $('scope').textContent = cities.length ? cities.join('、') : (DATA.city || '全国');
    $('src').textContent = DATA.source || '—';
    $('src-line').innerHTML = '数据来源：<a href="' + esc(DATA.source_url || '#') +
      '" target="_blank" rel="noopener noreferrer">' + esc(DATA.source || '—') + '</a>';
    var wb = $('warnbar');
    if(DATA.stale){
      wb.style.display = 'block';
      wb.textContent = '最近一次自动抓取未成功，当前展示的是上一次成功抓取的数据（' +
        (DATA.updated_at || '') + '）。';
    }
    document.title = '音乐剧·话剧 演出速览（' + (c.total || 0) + ' 场）';
  }

  document.querySelectorAll('.seg button').forEach(function(b){
    b.addEventListener('click', function(){
      var grp = b.parentElement;
      grp.querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-pressed','false'); });
      b.setAttribute('aria-pressed','true');
      if(b.dataset.kind !== undefined) state.kind = b.dataset.kind;
      if(b.dataset.when !== undefined) state.when = b.dataset.when;
      render();
    });
  });
  $('city').addEventListener('change', function(e){ state.city = e.target.value; render(); });
  $('q').addEventListener('input', function(e){ state.q = e.target.value.trim(); render(); });

  function hydrate(next){
    if(!next || !next.shows) return;
    DATA = next; fillCities(); paint(); render();
  }

  fillCities(); paint(); render();

  // 有独立 data.json 时优先取最新（GitHub Actions 每轮提交）
  fetch('data.json', {cache:'no-store'}).then(function(r){
    if(!r.ok) return;
    return r.json();
  }).then(hydrate).catch(function(){});

  // 每 10 分钟静默刷新一次
  setInterval(function(){
    fetch('data.json?ts=' + Date.now(), {cache:'no-store'})
      .then(function(r){ return r.ok ? r.json() : null; }).then(hydrate).catch(function(){});
  }, 600000);
})();
</script>
